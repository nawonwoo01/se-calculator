name: Mobile release preparation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH=$(node -p "require('@playwright/test').chromium.executablePath()") npm run test:ui
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run mobile:sync
      - run: ./gradlew --no-daemon assembleDebug bundleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-development-builds-not-for-store-upload
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
