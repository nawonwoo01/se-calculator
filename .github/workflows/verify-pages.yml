name: Verify deployed calculator
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed-web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-deployed-files.cjs
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH=$(node -p "require('@playwright/test').chromium.executablePath()") npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-web-verification
          path: |
            artifacts/deployed-web-*.json
            artifacts/deployed-web-*.png
            test-results/
