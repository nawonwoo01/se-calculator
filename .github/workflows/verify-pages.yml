name: Verify deployed calculator
on:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed-web:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-deployed-files.cjs
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH=$(node -p "require('@playwright/test').chromium.executablePath()") npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-web-verification
          path: |
            artifacts/deployed-web-*.json
            artifacts/deployed-web-*.png
            test-results/
